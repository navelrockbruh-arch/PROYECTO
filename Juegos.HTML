# 🎮 JUEGOS.HTML (FUNCIONAL)

```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creación de Juegos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

header{
    width:100%;
    padding:20px 40px;
    background:#111;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #222;
}

header h1{
    font-size:30px;
}

header a{
    text-decoration:none;
    color:white;
    border:1px solid white;
    padding:10px 20px;
    transition:0.3s;
}

header a:hover{
    background:white;
    color:black;
}

.hero{
    padding:80px 20px;
    text-align:center;
}

.hero h2{
    font-size:50px;
    margin-bottom:20px;
}

.hero p{
    color:#bbb;
}

.section{
    padding:60px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
    font-size:35px;
}

.game-box{
    max-width:700px;
    margin:auto;
    background:#181818;
    border:1px solid #333;
    padding:30px;
}

/* TETRIS */

#tetris-board{
    width:240px;
    height:400px;
    background:black;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:1px;
    border:2px solid #444;
}

.cell{
    background:#111;
    width:100%;
    height:100%;
}

.active{
    background:white;
}

.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    padding:12px 25px;
    border:none;
    background:white;
    color:black;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.8;
}

/* PACMAN */

#pacman-area{
    width:500px;
    max-width:100%;
    height:120px;
    background:black;
    margin:30px auto;
    position:relative;
    overflow:hidden;
    border:2px solid #444;
}

.pacman{
    width:50px;
    height:50px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:35px;
    left:0;
    clip-path:polygon(100% 50%, 0 0, 0 100%);
    animation:eat 0.3s infinite alternate;
}

.dot{
    width:12px;
    height:12px;
    background:#999;
    border-radius:50%;
    position:absolute;
    top:54px;
}

@keyframes eat{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(15deg);
    }
}

.info{
    text-align:center;
    color:#bbb;
    margin-top:15px;
}

@media(max-width:700px){

    .hero h2{
        font-size:35px;
    }

}

</style>
</head>
<body>

<header>

    <h1>Creación de Juegos</h1>

    <a href="index.html">
        Volver
    </a>

</header>

<section class="hero">

    <h2>
        Aprende a Crear Juegos
    </h2>

    <p>
        Mini demostraciones funcionales usando JavaScript.
    </p>

</section>

<!-- TETRIS -->

<section class="section">

    <h2 class="section-title">
        Mini Tetris
    </h2>

    <div class="game-box">

        <div id="tetris-board"></div>

        <div class="controls">

            <button id="startTetris">
                Iniciar
            </button>

            <button id="stopTetris">
                Detener
            </button>

        </div>

        <p class="info">
            Bloques cayendo automáticamente.
        </p>

    </div>

</section>

<!-- PACMAN -->

<section class="section">

    <h2 class="section-title">
        Mini Pac-Man
    </h2>

    <div class="game-box">

        <div id="pacman-area">

            <div class="pacman" id="pacman"></div>

            <div class="dot" style="left:120px"></div>
            <div class="dot" style="left:200px"></div>
            <div class="dot" style="left:280px"></div>
            <div class="dot" style="left:360px"></div>
            <div class="dot" style="left:440px"></div>

        </div>

        <div class="controls">

            <button id="startPacman">
                Ejecutar Pac-Man
            </button>

            <button id="resetPacman">
                Reiniciar
            </button>

        </div>

        <p class="info">
            Pac-Man comerá todos los puntos.
        </p>

    </div>

</section>

<script>

/* =========================
   TETRIS
========================= */

const board = document.getElementById("tetris-board");

const rows = 20;
const cols = 10;

let cells = [];
let currentRow = 0;
let currentCol = 4;
let tetrisInterval;

for(let i=0;i<rows*cols;i++){

    const cell = document.createElement("div");
    cell.classList.add("cell");
    board.appendChild(cell);
    cells.push(cell);

}

function drawBlock(){

    cells.forEach(cell=>{
        cell.classList.remove("active");
    });

    const index = currentRow * cols + currentCol;

    if(cells[index]){
        cells[index].classList.add("active");
    }

}

function moveBlock(){

    currentRow++;

    if(currentRow >= rows){
        currentRow = 0;
        currentCol = Math.floor(Math.random()*cols);
    }

    drawBlock();

}

function startTetris(){

    clearInterval(tetrisInterval);

    tetrisInterval = setInterval(moveBlock,150);

}

function stopTetris(){

    clearInterval(tetrisInterval);

}


document.getElementById("startTetris")
.addEventListener("click",startTetris);


document.getElementById("stopTetris")
.addEventListener("click",stopTetris);


drawBlock();

/* =========================
   PACMAN
========================= */

const pacman = document.getElementById("pacman");
const dots = document.querySelectorAll(".dot");

let pacmanX = 0;
let pacmanInterval;

function startPacman(){

    clearInterval(pacmanInterval);

    pacmanInterval = setInterval(()=>{

        pacmanX += 5;

        pacman.style.left = pacmanX + "px";

        dots.forEach(dot=>{

            const dotX = parseInt(dot.style.left);

            if(Math.abs(dotX - pacmanX) < 20){
                dot.style.opacity = "0";
            }

        });

        if(pacmanX > 500){
            clearInterval(pacmanInterval);
        }

    },30);

}

function resetPacman(){

    clearInterval(pacmanInterval);

    pacmanX = 0;

    pacman.style.left = "0px";

    dots.forEach(dot=>{
        dot.style.opacity = "1";
    });

}


document.getElementById("startPacman")
.addEventListener("click",startPacman);


document.getElementById("resetPacman")
.addEventListener("click",resetPacman);

</script>

</body>
</html>
